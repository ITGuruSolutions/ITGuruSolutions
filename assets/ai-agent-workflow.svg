<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="100%" height="160">
  <defs>
    <linearGradient id="wfGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4EC7DE"/>
      <stop offset="50%" stop-color="#7F4BFA"/>
      <stop offset="100%" stop-color="#FF5A87"/>
    </linearGradient>
    <pattern id="wfGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.75" opacity="0.3"/>
    </pattern>
    <filter id="wfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="160" rx="10" fill="#0B0F19" stroke="#1E293B" stroke-width="1"/>
  <rect width="1200" height="160" rx="10" fill="url(#wfGrid)"/>

  <!-- Section Header Tag -->
  <text x="30" y="26" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" letter-spacing="2" font-weight="600">AI WORKFLOW &amp; AGENT PIPELINE ARCHITECTURE</text>
  <text x="1170" y="26" fill="#4EC7DE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" letter-spacing="1" font-weight="600" text-anchor="end">AUTONOMOUS ORCHESTRATION</text>

  <!-- Central Track Line -->
  <line x1="120" y1="92" x2="1080" y2="92" stroke="#1E293B" stroke-width="2"/>

  <!-- Traveling Glowing Signal -->
  <circle r="4" fill="url(#wfGrad)" filter="url(#wfGlow)">
    <animateMotion path="M 120 92 L 1080 92" dur="4s" repeatCount="indefinite" />
  </circle>

  <!-- Node 1: Event Ingestion -->
  <g transform="translate(120, 92)">
    <rect x="-80" y="-38" width="160" height="76" rx="6" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <circle cx="0" cy="-18" r="5" fill="#4EC7DE"/>
    <text x="0" y="2" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">EVENT INGESTION</text>
    <text x="0" y="20" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" text-anchor="middle">Webhooks · n8n · Kafka</text>
  </g>

  <!-- Node 2: Vector Context -->
  <g transform="translate(360, 92)">
    <rect x="-80" y="-38" width="160" height="76" rx="6" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <circle cx="0" cy="-18" r="5" fill="#4EC7DE"/>
    <text x="0" y="2" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">VECTOR RETRIEVAL</text>
    <text x="0" y="20" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" text-anchor="middle">pgvector · Redis Embeds</text>
  </g>

  <!-- Node 3: LLM Reasoning -->
  <g transform="translate(600, 92)">
    <rect x="-85" y="-40" width="170" height="80" rx="6" fill="#111827" stroke="url(#wfGrad)" stroke-width="1.5"/>
    <circle cx="0" cy="-18" r="5" fill="#7F4BFA"/>
    <text x="0" y="2" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">LLM REASONING</text>
    <text x="0" y="20" fill="#4EC7DE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="600" text-anchor="middle">Claude · OpenAI · Llama</text>
  </g>

  <!-- Node 4: Schema Validation -->
  <g transform="translate(840, 92)">
    <rect x="-80" y="-38" width="160" height="76" rx="6" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <circle cx="0" cy="-18" r="5" fill="#FF5A87"/>
    <text x="0" y="2" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">SCHEMA VALIDATION</text>
    <text x="0" y="20" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" text-anchor="middle">Zod · JSON Output Guard</text>
  </g>

  <!-- Node 5: Action Dispatch -->
  <g transform="translate(1080, 92)">
    <rect x="-80" y="-38" width="160" height="76" rx="6" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <circle cx="0" cy="-18" r="5" fill="#FF5A87"/>
    <text x="0" y="2" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">ACTION DISPATCH</text>
    <text x="0" y="20" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" text-anchor="middle">DB · Email · Edge API</text>
  </g>
</svg>
