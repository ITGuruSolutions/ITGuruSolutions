<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%" height="120">
  <defs>
    <linearGradient id="timeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4EC7DE"/>
      <stop offset="50%" stop-color="#7F4BFA"/>
      <stop offset="100%" stop-color="#FF5A87"/>
    </linearGradient>
    <pattern id="timeGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.75" opacity="0.25"/>
    </pattern>
    <filter id="timeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="120" rx="10" fill="#0B0F19" stroke="#1E293B" stroke-width="1"/>
  <rect width="1200" height="120" rx="10" fill="url(#timeGrid)"/>

  <!-- Top label -->
  <text x="30" y="24" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" letter-spacing="2" font-weight="600">LIFECYCLE METHODOLOGY</text>
  <text x="1170" y="24" fill="#4EC7DE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" letter-spacing="1" font-weight="600" text-anchor="end">IDEA ➔ PRODUCTION</text>

  <!-- Central Track Line -->
  <line x1="80" y1="65" x2="1120" y2="65" stroke="#1E293B" stroke-width="2"/>

  <!-- Traveling Glowing Pulse -->
  <circle r="4" fill="url(#timeGrad)" filter="url(#timeGlow)">
    <animateMotion path="M 80 65 L 1120 65" dur="3.5s" repeatCount="indefinite" />
  </circle>

  <!-- 7 Nodes -->
  <!-- 01 DISCOVER -->
  <g transform="translate(80, 65)">
    <circle cx="0" cy="0" r="7" fill="#111827" stroke="#4EC7DE" stroke-width="2"/>
    <circle cx="0" cy="0" r="2.5" fill="#4EC7DE"/>
    <text x="0" y="24" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">01 DISCOVER</text>
    <text x="0" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="8" text-anchor="middle">PRD &amp; Schemas</text>
  </g>

  <!-- 02 ARCHITECT -->
  <g transform="translate(253, 65)">
    <circle cx="0" cy="0" r="7" fill="#111827" stroke="#4EC7DE" stroke-width="2"/>
    <circle cx="0" cy="0" r="2.5" fill="#4EC7DE"/>
    <text x="0" y="24" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">02 ARCHITECT</text>
    <text x="0" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="8" text-anchor="middle">ADRs &amp; Contracts</text>
  </g>

  <!-- 03 DESIGN -->
  <g transform="translate(426, 65)">
    <circle cx="0" cy="0" r="7" fill="#111827" stroke="#7F4BFA" stroke-width="2"/>
    <circle cx="0" cy="0" r="2.5" fill="#7F4BFA"/>
    <text x="0" y="24" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">03 DESIGN</text>
    <text x="0" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="8" text-anchor="middle">Design Tokens</text>
  </g>

  <!-- 04 BUILD -->
  <g transform="translate(600, 65)">
    <circle cx="0" cy="0" r="7" fill="#111827" stroke="#7F4BFA" stroke-width="2"/>
    <circle cx="0" cy="0" r="2.5" fill="#7F4BFA"/>
    <text x="0" y="24" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">04 BUILD</text>
    <text x="0" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="8" text-anchor="middle">Type-Safe Core</text>
  </g>

  <!-- 05 OPTIMISE -->
  <g transform="translate(773, 65)">
    <circle cx="0" cy="0" r="7" fill="#111827" stroke="#FF5A87" stroke-width="2"/>
    <circle cx="0" cy="0" r="2.5" fill="#FF5A87"/>
    <text x="0" y="24" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">05 OPTIMISE</text>
    <text x="0" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="8" text-anchor="middle">Vitals &amp; AEO</text>
  </g>

  <!-- 06 DEPLOY -->
  <g transform="translate(946, 65)">
    <circle cx="0" cy="0" r="7" fill="#111827" stroke="#FF5A87" stroke-width="2"/>
    <circle cx="0" cy="0" r="2.5" fill="#FF5A87"/>
    <text x="0" y="24" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">06 DEPLOY</text>
    <text x="0" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="8" text-anchor="middle">Edge &amp; CI/CD</text>
  </g>

  <!-- 07 SCALE -->
  <g transform="translate(1120, 65)">
    <circle cx="0" cy="0" r="7" fill="#111827" stroke="#4EC7DE" stroke-width="2"/>
    <circle cx="0" cy="0" r="2.5" fill="#4EC7DE"/>
    <text x="0" y="24" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">07 SCALE</text>
    <text x="0" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="8" text-anchor="middle">Observability</text>
  </g>
</svg>
