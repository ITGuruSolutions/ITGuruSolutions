<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="100%" height="150">
  <defs>
    <linearGradient id="labGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4EC7DE"/>
      <stop offset="50%" stop-color="#7F4BFA"/>
      <stop offset="100%" stop-color="#FF5A87"/>
    </linearGradient>
    <pattern id="labGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.75" opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="1200" height="150" rx="10" fill="#0B0F19" stroke="#1E293B" stroke-width="1"/>
  <rect width="1200" height="150" rx="10" fill="url(#labGrid)"/>

  <!-- Card 1: 3D & WebGL Canvas -->
  <g transform="translate(20, 20)">
    <rect width="365" height="110" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <rect width="365" height="2" rx="1" fill="#4EC7DE"/>
    <text x="20" y="32" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">3D &amp; WebGL Canvas Engine</text>
    <text x="20" y="54" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Perspective matrices, spatial cards, dynamic shaders</text>
    <text x="20" y="85" fill="#4EC7DE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10">Three.js · CSS 3D · Canvas GL · Mat4</text>
  </g>

  <!-- Card 2: Kinetic Motion & GSAP -->
  <g transform="translate(415, 20)">
    <rect width="370" height="110" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <rect width="370" height="2" rx="1" fill="#7F4BFA"/>
    <text x="20" y="32" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Kinetic Typography &amp; GSAP</text>
    <text x="20" y="54" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">ScrollTrigger, text scramble, fluid momentum</text>
    <text x="20" y="85" fill="#7F4BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10">GSAP 3 · ScrollSmoother · SplitText · SVG Morph</text>
  </g>

  <!-- Card 3: Micro-Interactions & Physics -->
  <g transform="translate(815, 20)">
    <rect width="365" height="110" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <rect width="365" height="2" rx="1" fill="#FF5A87"/>
    <text x="20" y="32" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Micro-Interactions &amp; Physics</text>
    <text x="20" y="54" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Spring dynamics, gestural feedback, reactive audio</text>
    <text x="20" y="85" fill="#FF5A87" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10">Framer Motion · Radix UI · Spring Rig · Web Audio</text>
  </g>
</svg>
