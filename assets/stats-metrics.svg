<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%" height="120">
  <defs>
    <linearGradient id="statGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4EC7DE"/>
      <stop offset="50%" stop-color="#7F4BFA"/>
      <stop offset="100%" stop-color="#FF5A87"/>
    </linearGradient>
    <pattern id="statGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.75" opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="1200" height="120" rx="10" fill="#0B0F19" stroke="#1E293B" stroke-width="1"/>
  <rect width="1200" height="120" rx="10" fill="url(#statGrid)"/>

  <!-- Tile 1: 1500+ Builds -->
  <g transform="translate(20, 15)">
    <rect width="215" height="90" rx="6" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <rect width="215" height="2" rx="1" fill="#4EC7DE"/>
    <text x="20" y="38" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="24" font-weight="800">1,500+</text>
    <text x="20" y="58" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1">PROD BUILDS</text>
    <text x="20" y="74" fill="#4EC7DE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9">Global Deployments</text>
  </g>

  <!-- Tile 2: 92 Repositories -->
  <g transform="translate(255, 15)">
    <rect width="215" height="90" rx="6" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <rect width="215" height="2" rx="1" fill="#7F4BFA"/>
    <text x="20" y="38" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="24" font-weight="800">92</text>
    <text x="20" y="58" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1">PUBLIC REPOS</text>
    <text x="20" y="74" fill="#7F4BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9">Active Codebases</text>
  </g>

  <!-- Tile 3: 15+ Countries -->
  <g transform="translate(490, 15)">
    <rect width="220" height="90" rx="6" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <rect width="220" height="2" rx="1" fill="url(#statGrad)"/>
    <text x="20" y="38" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="24" font-weight="800">15+</text>
    <text x="20" y="58" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1">GLOBAL MARKETS</text>
    <text x="20" y="74" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9">US · UK · UAE · IN · AU</text>
  </g>

  <!-- Tile 4: 98% Satisfaction -->
  <g transform="translate(730, 15)">
    <rect width="215" height="90" rx="6" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <rect width="215" height="2" rx="1" fill="#FF5A87"/>
    <text x="20" y="38" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="24" font-weight="800">98%</text>
    <text x="20" y="58" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1">CLIENT RATING</text>
    <text x="20" y="74" fill="#FF5A87" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9">Retention &amp; Delivery</text>
  </g>

  <!-- Tile 5: Core Web Vitals -->
  <g transform="translate(965, 15)">
    <rect width="215" height="90" rx="6" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <rect width="215" height="2" rx="1" fill="#4EC7DE"/>
    <text x="20" y="38" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="24" font-weight="800">&lt; 0.8s</text>
    <text x="20" y="58" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1">AVG LCP SPEED</text>
    <text x="20" y="74" fill="#4EC7DE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9">Core Web Vitals Pass</text>
