<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Single Master Brand Gradient -->
    <linearGradient id="brandAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4EC7DE"/>
      <stop offset="50%" stop-color="#7F4BFA"/>
      <stop offset="100%" stop-color="#FF5A87"/>
    </linearGradient>

    <!-- Subtle Card Background Gradient -->
    <linearGradient id="bgLinear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1424"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>

    <!-- Subtle Grid -->
    <pattern id="subtleGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.35"/>
    </pattern>

    <style>
      .wordmark {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: 4px;
      }
      .tagline {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
        font-weight: 500;
        font-size: 13.5px;
        letter-spacing: 3px;
        fill: #94A3B8;
        text-transform: uppercase;
      }
      .mono-pill {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1.5px;
        fill: #94A3B8;
      }
      .metric-value {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
        font-weight: 700;
        font-size: 15px;
        fill: #F1F5F9;
        letter-spacing: 0.5px;
      }
      .metric-key {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
        font-weight: 500;
        font-size: 10px;
        fill: #64748B;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      @keyframes subtlePulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      .live-dot {
        animation: subtlePulse 3.5s ease-in-out infinite;
        transform-origin: 472px 42px;
      }
    </style>
  </defs>

  <!-- Container Surface -->
  <rect width="1200" height="280" rx="12" fill="url(#bgLinear)" stroke="#1E293B" stroke-width="1"/>

  <!-- Subtle Architectural Grid Overlay -->
  <rect width="1200" height="280" rx="12" fill="url(#subtleGrid)"/>

  <!-- Top Status Pill -->
  <g transform="translate(0, 0)">
    <rect x="455" y="30" width="290" height="24" rx="12" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <circle cx="472" cy="42" r="3.5" fill="#10B981" class="live-dot"/>
    <text x="484" y="46" class="mono-pill">DELHI NCR, INDIA • ACTIVE</text>
  </g>

  <!-- Main Wordmark -->
  <text x="600" y="118" text-anchor="middle" class="wordmark" fill="url(#brandAccentGrad)">IT GURU SOLUTIONS</text>

  <!-- 2px Precision Accent Underline -->
  <rect x="450" y="132" width="300" height="2" rx="1" fill="url(#brandAccentGrad)"/>

  <!-- Tagline -->
  <text x="600" y="162" text-anchor="middle" class="tagline">ENGINEERING DIGITAL PLATFORMS • TECHNICAL SEO &amp; AI SEARCH ARCHITECTURE</text>

  <!-- Metrics Matrix (4 Compact SaaS Badges) -->
  <g transform="translate(150, 195)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="200" height="52" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <text x="100" y="24" text-anchor="middle" class="metric-value">1,500+ Builds</text>
    <text x="100" y="41" text-anchor="middle" class="metric-key">Delivered Since 2020</text>

    <!-- Metric 2 -->
    <rect x="233" y="0" width="200" height="52" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <text x="333" y="24" text-anchor="middle" class="metric-value">98% Satisfaction</text>
    <text x="333" y="41" text-anchor="middle" class="metric-key">127+ Client Reviews</text>

    <!-- Metric 3 -->
    <rect x="466" y="0" width="200" height="52" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <text x="566" y="24" text-anchor="middle" class="metric-value">&lt; 1.2s Load Speed</text>
    <text x="566" y="41" text-anchor="middle" class="metric-key">Core Web Vitals</text>

    <!-- Metric 4 -->
    <rect x="700" y="0" width="200" height="52" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <text x="800" y="24" text-anchor="middle" class="metric-value">15+ Countries</text>
    <text x="800" y="41" text-anchor="middle" class="metric-key">Global Footprint</text>
  </g>
</svg>
