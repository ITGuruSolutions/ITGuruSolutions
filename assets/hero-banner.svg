<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Master Brand Accent Gradient with Subtle 10s Spectral Shift -->
    <linearGradient id="heroTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4EC7DE">
        <animate attributeName="stop-color" values="#4EC7DE; #7F4BFA; #FF5A87; #4EC7DE" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#7F4BFA">
        <animate attributeName="stop-color" values="#7F4BFA; #FF5A87; #4EC7DE; #7F4BFA" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#FF5A87">
        <animate attributeName="stop-color" values="#FF5A87; #4EC7DE; #7F4BFA; #FF5A87" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Aceternity Spotlight Background Radial Aura -->
    <radialGradient id="spotlightGlow" cx="50%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#7F4BFA" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#4EC7DE" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>

    <!-- Dark SaaS Canvas Base -->
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1526"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>

    <!-- Precise 32px Architectural Grid -->
    <pattern id="archGrid32" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>

    <style>
      .wordmark {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        letter-spacing: 5px;
      }
      .tagline {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 3.5px;
        fill: #94A3B8;
        text-transform: uppercase;
      }
      .mono-signal {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 1.5px;
        fill: #64748B;
      }
      .status-pill-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1.5px;
        fill: #94A3B8;
      }
      .metric-val {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
        font-weight: 700;
        font-size: 14.5px;
        fill: #F1F5F9;
      }
      .metric-lbl {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
        font-weight: 500;
        font-size: 9.5px;
        fill: #64748B;
        letter-spacing: 0.8px;
        text-transform: uppercase;
      }

      @keyframes liveSignal {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      .live-signal-dot {
        animation: liveSignal 3.5s ease-in-out infinite;
        transform-origin: 472px 38px;
      }

      @keyframes subtleFloat {
        0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { transform: translateY(-6px) translateX(3px); opacity: 0.8; }
      }
      .particle-a { animation: subtleFloat 5s ease-in-out infinite; }
      .particle-b { animation: subtleFloat 7s ease-in-out infinite 1.5s; }
      .particle-c { animation: subtleFloat 6s ease-in-out infinite 3s; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="280" rx="12" fill="url(#canvasBg)" stroke="#1E293B" stroke-width="1"/>
  <rect width="1200" height="280" rx="12" fill="url(#archGrid32)"/>
  <rect width="1200" height="280" rx="12" fill="url(#spotlightGlow)"/>

  <!-- Subtle Floating Architecture Particles -->
  <circle cx="160" cy="80" r="2.5" fill="#4EC7DE" class="particle-a"/>
  <circle cx="1040" cy="70" r="3" fill="#7F4BFA" class="particle-b"/>
  <circle cx="1100" cy="190" r="2.5" fill="#FF5A87" class="particle-c"/>
  <circle cx="90" cy="180" r="2" fill="#4EC7DE" class="particle-b"/>
  <line x1="160" y1="80" x2="210" y2="105" stroke="#4EC7DE" stroke-width="0.5" stroke-dasharray="2 2" stroke-opacity="0.3"/>
  <line x1="1040" y1="70" x2="1100" y2="190" stroke="#7F4BFA" stroke-width="0.5" stroke-dasharray="2 2" stroke-opacity="0.25"/>

  <!-- Technical Corner Signals -->
  <text x="45" y="42" class="mono-signal">01 / ENGINEERING SYSTEMS</text>
  <text x="1025" y="42" class="mono-signal">02 / CORE WEB VITALS</text>
  <text x="45" y="248" class="mono-signal">03 / SEARCH ARCHITECTURE</text>
  <text x="1080" y="248" class="mono-signal">04 / AI CITATIONS</text>

  <!-- Live Status Pill -->
  <g>
    <rect x="455" y="26" width="290" height="24" rx="12" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <circle cx="472" cy="38" r="3.5" fill="#10B981" class="live-signal-dot"/>
    <text x="484" y="42" class="status-pill-text">DELHI NCR, INDIA • ACTIVE</text>
  </g>

  <!-- Wordmark -->
  <text x="600" y="112" text-anchor="middle" class="wordmark" fill="url(#heroTitleGrad)">IT GURU SOLUTIONS</text>

  <!-- 2px Precision Underline -->
  <rect x="460" y="126" width="280" height="2" rx="1" fill="url(#heroTitleGrad)"/>

  <!-- Tagline -->
  <text x="600" y="154" text-anchor="middle" class="tagline">TECHNOLOGY • ENGINEERING • DIGITAL GROWTH</text>

  <!-- 4 Verified Metric Cards -->
  <g transform="translate(150, 185)">
    <rect x="0" y="0" width="200" height="50" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <text x="100" y="23" text-anchor="middle" class="metric-val">1,500+ Builds</text>
    <text x="100" y="39" text-anchor="middle" class="metric-lbl">Delivered Since 2020</text>

    <rect x="233" y="0" width="200" height="50" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <text x="333" y="23" text-anchor="middle" class="metric-val">98% Satisfaction</text>
    <text x="333" y="39" text-anchor="middle" class="metric-lbl">127+ Client Reviews</text>

    <rect x="466" y="0" width="200" height="50" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <text x="566" y="23" text-anchor="middle" class="metric-val">&lt; 1.2s LCP Speed</text>
    <text x="566" y="39" text-anchor="middle" class="metric-lbl">Core Web Vitals</text>

    <rect x="700" y="0" width="200" height="50" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <text x="800" y="23" text-anchor="middle" class="metric-val">15+ Countries</text>
    <text x="800" y="39" text-anchor="middle" class="metric-lbl">Global Footprint</text>
  </g>
</svg>
