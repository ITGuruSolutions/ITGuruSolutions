<svg width="900" height="240" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#070B14"/>
    </linearGradient>
    
    <!-- Glow Gradients -->
    <radialGradient id="glowCyan" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradient with Animation -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA">
        <animate attributeName="stop-color" values="#60A5FA; #38BDF8; #A78BFA; #34D399; #60A5FA" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8; #A78BFA; #34D399; #60A5FA; #38BDF8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#A78BFA">
        <animate attributeName="stop-color" values="#A78BFA; #34D399; #60A5FA; #38BDF8; #A78BFA" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Border Beam Gradient -->
    <linearGradient id="borderBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.5"/>
    </pattern>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 900;
        font-size: 40px;
        letter-spacing: 2px;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 3.5px;
        fill: #94A3B8;
        text-transform: uppercase;
      }
      .badge-text {
        font-family: 'SF Mono', Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1px;
      }
      .metric-num {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        font-weight: 800;
        fill: #F8FAFC;
      }
      .metric-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 10px;
        font-weight: 500;
        fill: #94A3B8;
        letter-spacing: 0.5px;
      }
      
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      .pulsing-dot {
        animation: pulseDot 2s ease-in-out infinite;
        transform-origin: 126px 36px;
      }

      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { transform: translateY(-8px) translateX(4px); opacity: 0.8; }
      }
      .particle-1 { animation: floatParticle 4s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 6s ease-in-out infinite 1s; }
      .particle-3 { animation: floatParticle 5s ease-in-out infinite 2s; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid -->
  <rect width="900" height="240" rx="16" fill="url(#grid)"/>

  <!-- Glow Overlays -->
  <rect width="900" height="240" rx="16" fill="url(#glowCyan)"/>
  <rect width="900" height="240" rx="16" fill="url(#glowViolet)"/>
  <rect width="900" height="240" rx="16" fill="url(#glowBlue)"/>

  <!-- Border -->
  <rect x="1" y="1" width="898" height="238" rx="15" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Floating Particles / Nodes -->
  <circle cx="120" cy="90" r="3" fill="#38BDF8" class="particle-1" />
  <circle cx="780" cy="60" r="2.5" fill="#818CF8" class="particle-2" />
  <circle cx="830" cy="160" r="3.5" fill="#34D399" class="particle-3" />
  <circle cx="70" cy="180" r="2" fill="#F472B6" class="particle-2" />
  <path d="M120 90 L160 110" stroke="#38BDF8" stroke-width="0.5" stroke-dasharray="2 2" stroke-opacity="0.4" />
  <path d="M780 60 L830 160" stroke="#818CF8" stroke-width="0.5" stroke-dasharray="2 2" stroke-opacity="0.3" />

  <!-- Live Status Badge (Top Center) -->
  <g transform="translate(305, 24)">
    <rect width="290" height="24" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="12" r="4" fill="#10B981" class="pulsing-dot"/>
    <text x="28" y="16" fill="#38BDF8" class="badge-text">SYSTEMS ACTIVE • DELHI NCR ➔ GLOBAL</text>
  </g>

  <!-- Main Branding Title -->
  <text x="450" y="105" text-anchor="middle" class="title" fill="url(#textGrad)">IT GURU SOLUTIONS</text>
  
  <!-- Subtitle Tagline -->
  <text x="450" y="132" text-anchor="middle" class="subtitle">ENTERPRISE NEXT.JS ENGINEERING • TECHNICAL SEO &amp; AEO • CLOUD SYSTEMS</text>

  <!-- Metrics Ribbon / Bottom Bar -->
  <g transform="translate(45, 165)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="185" height="50" rx="10" fill="#0F172A" fill-opacity="0.8" stroke="#1E293B" stroke-width="1"/>
    <text x="92" y="24" text-anchor="middle" class="metric-num">1,500+ Builds</text>
    <text x="92" y="40" text-anchor="middle" class="metric-label">DELIVERED SINCE 2020</text>

    <!-- Metric 2 -->
    <rect x="205" y="0" width="185" height="50" rx="10" fill="#0F172A" fill-opacity="0.8" stroke="#1E293B" stroke-width="1"/>
    <text x="297" y="24" text-anchor="middle" class="metric-num">98% Satisfaction</text>
    <text x="297" y="40" text-anchor="middle" class="metric-label">127+ VERIFIED REVIEWS</text>

    <!-- Metric 3 -->
    <rect x="410" y="0" width="195" height="50" rx="10" fill="#0F172A" fill-opacity="0.8" stroke="#1E293B" stroke-width="1"/>
    <text x="507" y="24" text-anchor="middle" class="metric-num">&lt; 1.2s Page Speed</text>
    <text x="507" y="40" text-anchor="middle" class="metric-label">SUB-SECOND CORE WEB VITALS</text>

    <!-- Metric 4 -->
    <rect x="625" y="0" width="185" height="50" rx="10" fill="#0F172A" fill-opacity="0.8" stroke="#1E293B" stroke-width="1"/>
    <text x="717" y="24" text-anchor="middle" class="metric-num">15+ Countries</text>
    <text x="717" y="40" text-anchor="middle" class="metric-label">GLOBAL CLIENT FOOTPRINT</text>
  </g>
</svg>
