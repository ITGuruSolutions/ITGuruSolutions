<svg width="1200" height="6" viewBox="0 0 1200 6" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.2"/>
      <stop offset="25%" stop-color="#4EC7DE"/>
      <stop offset="50%" stop-color="#7F4BFA"/>
      <stop offset="75%" stop-color="#FF5A87"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <!-- Background hairline -->
  <line x1="0" y1="3" x2="1200" y2="3" stroke="#1E293B" stroke-width="1"/>
  <!-- Central gradient accent segment (400px centered) -->
  <line x1="400" y1="3" x2="800" y2="3" stroke="url(#dividerGrad)" stroke-width="2"/>
</svg>
