<svg width="1200" height="150" viewBox="0 0 1200 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ecomPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4EC7DE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7F4BFA" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF5A87" stop-opacity="0"/>
    </linearGradient>
    <style>
      .case-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
        font-weight: 800;
        font-size: 15px;
        fill: #F8FAFC;
        letter-spacing: 1px;
      }
      .case-meta {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10px;
        font-weight: 600;
        fill: #94A3B8;
        letter-spacing: 1px;
      }
      .flow-step-num {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 9px;
        font-weight: 700;
        fill: #64748B;
      }
      .flow-step-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
        font-weight: 700;
        font-size: 11px;
        fill: #F1F5F9;
      }
    </style>
  </defs>

  <rect width="1200" height="150" rx="10" fill="#0B0F19" stroke="#1E293B" stroke-width="1"/>

  <!-- Header line -->
  <g transform="translate(30, 24)">
    <text x="0" y="0" class="case-title">FEATURED CASE STUDY: MOBILEGADGETSWORLD</text>
    <text x="440" y="0" class="case-meta">• ARCHITECTURE: NEXT.JS 15 + TAILWIND V4 + POSTGRESQL</text>
  </g>

  <!-- Commerce Bus Line -->
  <line x1="40" y1="92" x2="1160" y2="92" stroke="#1E293B" stroke-width="2"/>
  <rect x="40" y="91" width="220" height="2" rx="1" fill="url(#ecomPulse)">
    <animate attributeName="x" values="40; 940; 40" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- Step 1: Catalog -->
  <g transform="translate(30, 52)">
    <rect width="170" height="74" rx="6" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <text x="12" y="20" class="flow-step-num">01 / DISCOVERY</text>
    <text x="12" y="38" class="flow-step-title">Luxe Brand Deals</text>
    <text x="12" y="54" class="case-meta">Next.js SSG / ISR</text>
  </g>

  <!-- Step 2: Search -->
  <g transform="translate(225, 52)">
    <rect width="170" height="74" rx="6" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <text x="12" y="20" class="flow-step-num">02 / SEARCH</text>
    <text x="12" y="38" class="flow-step-title">Live Filter Engine</text>
    <text x="12" y="54" class="case-meta">Debounced Query</text>
  </g>

  <!-- Step 3: Cart -->
  <g transform="translate(420, 52)">
    <rect width="170" height="74" rx="6" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <text x="12" y="20" class="flow-step-num">03 / STATE</text>
    <text x="12" y="38" class="flow-step-title">Cart Context &amp; Synced</text>
    <text x="12" y="54" class="case-meta">Redux / LocalStorage</text>
  </g>

  <!-- Step 4: Checkout -->
  <g transform="translate(615, 52)">
    <rect width="170" height="74" rx="6" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <text x="12" y="20" class="flow-step-num">04 / CHECKOUT</text>
    <text x="12" y="38" class="flow-step-title">Multi-Step Flow</text>
    <text x="12" y="54" class="case-meta">Zod Address Valid.</text>
  </g>

  <!-- Step 5: Payments -->
  <g transform="translate(810, 52)">
    <rect width="170" height="74" rx="6" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <text x="12" y="20" class="flow-step-num">05 / PAYMENTS</text>
    <text x="12" y="38" class="flow-step-title">Razorpay &amp; Cards</text>
    <text x="12" y="54" class="case-meta">Webhook Settlement</text>
  </g>

  <!-- Step 6: Notifications -->
  <g transform="translate(1005, 52)">
    <rect width="165" height="74" rx="6" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <text x="12" y="20" class="flow-step-num">06 / DISPATCH</text>
    <text x="12" y="38" class="flow-step-title">Resend Email System</text>
    <text x="12" y="54" class="case-meta">HTML Invoices</text>
  </g>
</svg>
